<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khajana — Word Meaning</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800"
      x-data="vocabApp()" x-init="init()">

  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto max-w-6xl px-4 py-4">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h1 class="text-2xl font-bold text-indigo-700">📚 Khajana</h1>
          <p class="text-sm text-slate-500">Word meaning explorer</p>
        </div>
        <div class="text-sm text-slate-500">
          <span x-text="filteredWords.length"></span> matching words
          <span class="mx-1">•</span>
          <span x-text="words.length"></span> total entries
        </div>
      </div>

      <div class="mt-4 grid gap-3 md:grid-cols-[1fr_180px_auto]">
        <div class="relative">
          <input x-model.debounce.150ms="query"
                 @keydown.escape="query = ''"
                 type="search"
                 placeholder="Search word, meaning, example..."
                 class="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 pr-10 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
          <button x-show="query" @click="query=''"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700">✕</button>
        </div>

        <select x-model="partOfSpeech"
                class="rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
          <option value="">All parts of speech</option>
          <template x-for="type in types" :key="type">
            <option :value="type" x-text="type"></option>
          </template>
        </select>

        <button @click="randomWord()"
                class="rounded-xl bg-indigo-600 px-5 py-3 font-semibold text-white shadow-sm transition hover:bg-indigo-700">
          🎲 Random word
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">
    <div x-show="loading" class="rounded-2xl bg-white p-10 text-center shadow-sm">
      Loading vocabulary...
    </div>

    <div x-show="error" class="rounded-2xl border border-red-200 bg-red-50 p-5 text-red-700" x-text="error"></div>

    <section x-show="!loading && !error">
      <div x-show="selected" class="mb-6 rounded-2xl border border-indigo-100 bg-white p-6 shadow-sm">
        <div class="flex items-start justify-between gap-4">
          <div>
            <div class="mb-2 flex flex-wrap items-center gap-2">
              <span class="rounded-full bg-indigo-100 px-3 py-1 text-xs font-semibold uppercase text-indigo-700"
                    x-text="selected?.type"></span>
              <span class="text-xs text-slate-400" x-text="'#' + (selectedIndex + 1)"></span>
            </div>
            <h2 class="text-4xl font-bold tracking-tight text-slate-900" x-text="selected?.word"></h2>
          </div>
          <button @click="selected=null"
                  class="rounded-lg px-3 py-2 text-slate-400 hover:bg-slate-100 hover:text-slate-700">✕</button>
        </div>

        <div class="mt-5">
          <h3 class="mb-2 font-semibold text-slate-700">Meanings</h3>
          <ul class="space-y-2">
            <template x-for="(meaning, i) in (selected?.meanings || [])" :key="i">
              <li class="flex gap-3 rounded-lg bg-slate-50 px-4 py-3">
                <span class="font-bold text-indigo-500" x-text="i + 1 + '.'"></span>
                <span x-text="meaning"></span>
              </li>
            </template>
          </ul>
        </div>

        <div class="mt-5" x-show="selected?.examples?.length">
          <h3 class="mb-2 font-semibold text-slate-700">Example</h3>
          <template x-for="(example, i) in (selected?.examples || [])" :key="i">
            <blockquote class="rounded-xl border-l-4 border-indigo-400 bg-indigo-50 px-4 py-3 italic text-slate-700"
                        x-text="example"></blockquote>
          </template>
        </div>
      </section>

      <div x-show="!selected && filteredWords.length === 0"
           class="rounded-2xl bg-white p-10 text-center shadow-sm">
        <div class="text-4xl">🔎</div>
        <h2 class="mt-3 text-lg font-bold">No words found</h2>
        <p class="mt-1 text-sm text-slate-500">Try another search term or clear the filters.</p>
      </div>

      <div x-show="!selected" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <template x-for="item in paginatedWords" :key="item.id">
          <article @click="selectWord(item)"
                   class="group cursor-pointer rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:border-indigo-200 hover:shadow-md">
            <div class="flex items-center justify-between gap-3">
              <h2 class="text-xl font-bold text-slate-900 group-hover:text-indigo-700" x-text="item.word"></h2>
              <span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-500"
                    x-text="item.type"></span>
            </div>
            <p class="mt-3 line-clamp-2 text-sm text-slate-600"
               x-text="item.meanings.join('; ')"></p>
            <p class="mt-4 text-xs font-medium text-indigo-600">View details →</p>
          </article>
        </template>
      </div>

      <div x-show="!selected && totalPages > 1" class="mt-8 flex items-center justify-center gap-2">
        <button @click="page--" :disabled="page === 1"
                class="rounded-lg border bg-white px-4 py-2 text-sm disabled:cursor-not-allowed disabled:opacity-40">
          Previous
        </button>
        <span class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white">
          Page <span x-text="page"></span> / <span x-text="totalPages"></span>
        </span>
        <button @click="page++" :disabled="page === totalPages"
                class="rounded-lg border bg-white px-4 py-2 text-sm disabled:cursor-not-allowed disabled:opacity-40">
          Next
        </button>
      </div>
    </section>
  </main>

  <footer class="mx-auto max-w-6xl px-4 pb-8 pt-4 text-center text-xs text-slate-400">
    Data loaded from <code>data/khajana.xml</code>
  </footer>

<script>
function vocabApp() {
  return {
    words: [],
    query: '',
    partOfSpeech: '',
    selected: null,
    selectedIndex: -1,
    page: 1,
    pageSize: 24,
    loading: true,
    error: '',

    async init() {
      try {
        const response = await fetch('data/khajana.xml');
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const xmlText = await response.text();
        const xml = new DOMParser().parseFromString(xmlText, 'application/xml');

        if (xml.querySelector('parsererror')) {
          throw new Error('Could not parse khajana.xml');
        }

        this.words = [...xml.querySelectorAll('myword')].map((node, id) => ({
          id,
          word: node.querySelector(':scope > word')?.textContent?.trim() || '',
          type: node.querySelector(':scope > word')?.getAttribute('type') || 'unknown',
          meanings: [...node.querySelectorAll(':scope > meanings > meaning')]
            .map(x => x.textContent.trim()).filter(Boolean),
          examples: [...node.querySelectorAll(':scope > examples > example')]
            .map(x => x.textContent.trim()).filter(Boolean)
        })).filter(x => x.word);

        this.loading = false;
      } catch (e) {
        this.loading = false;
        this.error = 'Unable to load data/khajana.xml. If you opened index.html directly, run the local server shown in README.md.';
        console.error(e);
      }
    },

    get types() {
      return [...new Set(this.words.map(x => x.type))].sort();
    },

    get filteredWords() {
      const q = this.query.trim().toLowerCase();
      return this.words.filter(item => {
        const matchesType = !this.partOfSpeech || item.type === this.partOfSpeech;
        const haystack = [
          item.word, item.type, ...item.meanings, ...item.examples
        ].join(' ').toLowerCase();
        return matchesType && (!q || haystack.includes(q));
      });
    },

    get totalPages() {
      return Math.max(1, Math.ceil(this.filteredWords.length / this.pageSize));
    },

    get paginatedWords() {
      if (this.page > this.totalPages) this.page = this.totalPages;
      const start = (this.page - 1) * this.pageSize;
      return this.filteredWords.slice(start, start + this.pageSize);
    },

    set query(value) {
      this._query = value;
      this.page = 1;
      this.selected = null;
    },

    get query() {
      return this._query || '';
    },

    set partOfSpeech(value) {
      this._partOfSpeech = value;
      this.page = 1;
      this.selected = null;
    },

    get partOfSpeech() {
      return this._partOfSpeech || '';
    },

    selectWord(item) {
      this.selected = item;
      this.selectedIndex = this.words.findIndex(x => x.id === item.id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    randomWord() {
      if (!this.words.length) return;
      this.selectWord(this.words[Math.floor(Math.random() * this.words.length)]);
    }
  }
}
</script>
</body>
</html>
