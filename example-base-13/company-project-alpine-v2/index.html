<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Project Explorer V2</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script><style>[x-cloak]{display:none!important}.markdown h1{font-size:1.5rem;font-weight:700;margin:0 0 1rem}.markdown h2{font-size:1.15rem;font-weight:700;margin:1.5rem 0 .75rem}.markdown h3{font-weight:700;margin:1.2rem 0 .5rem}.markdown p{margin:.65rem 0;line-height:1.7}.markdown ul{list-style:disc;padding-left:1.5rem;margin:.75rem 0}.markdown ol{list-style:decimal;padding-left:1.5rem}.markdown li{margin:.35rem 0}.markdown strong{font-weight:700;color:#0f172a}.markdown a{color:#2563eb;text-decoration:underline}.markdown blockquote{border-left:3px solid #cbd5e1;padding-left:1rem;color:#64748b}</style></head><body class="min-h-screen bg-slate-100 text-slate-800" x-data="app()" x-init="loadData()"><header class="sticky top-0 z-40 border-b bg-white/95 backdrop-blur"><div class="mx-auto flex max-w-[1500px] items-center justify-between px-4 py-4 lg:px-6"><div><h1 class="text-xl font-bold text-slate-900">Career Project Explorer</h1><p class="text-xs text-slate-500">V2 · List + Markdown Details</p></div><div class="flex gap-2 text-xs"><span class="rounded-full bg-blue-50 px-3 py-1.5 text-blue-700" x-text="companies.length+' Companies'"></span><span class="rounded-full bg-violet-50 px-3 py-1.5 text-violet-700" x-text="projects.length+' Projects'"></span></div></div></header><main class="mx-auto max-w-[1500px] px-4 py-5 lg:px-6"><template x-if="loading"><div class="rounded-2xl bg-white p-12 text-center shadow"><p>Loading...</p></div></template><template x-if="error"><div class="rounded-xl border border-red-200 bg-red-50 p-5 text-red-700" x-text="error"></div></template><template x-if="!loading&&!error"><div><div class="mb-5 flex flex-col gap-3 rounded-2xl bg-white p-4 shadow lg:flex-row lg:items-center"><div class="flex rounded-lg bg-slate-100 p-1"><button @click="mode='projects'" :class="mode==='projects'?'bg-white text-slate-900 shadow':'text-slate-500'" class="rounded-md px-4 py-2 text-sm font-medium">Projects</button><button @click="mode='companies'" :class="mode==='companies'?'bg-white text-slate-900 shadow':'text-slate-500'" class="rounded-md px-4 py-2 text-sm font-medium">Companies</button></div><input x-model="search" class="w-full rounded-lg border px-3 py-2 text-sm lg:max-w-xl" :placeholder="mode==='projects'?'Search project, company, technology...':'Search company, industry, location...'"><select x-show="mode==='projects'" x-model="status" class="rounded-lg border bg-white px-3 py-2 text-sm"><option value="">All Status</option><option>PLANNED</option><option value="IN_PROGRESS">IN_PROGRESS</option><option>COMPLETED</option><option>ON_HOLD">ON_HOLD</option></select><span class="text-xs text-slate-400" x-text="visibleItems().length+' results'"></span></div><div class="grid min-h-[680px] gap-5 lg:grid-cols-[390px_minmax(0,1fr)]"><aside class="overflow-hidden rounded-2xl bg-white shadow"><div class="border-b p-5"><h2 class="font-semibold" x-text="mode==='projects'?'Projects':'Companies'"></h2><p class="mt-1 text-xs text-slate-500">Select an item to see details.</p></div><div class="max-h-[760px] overflow-y-auto"><template x-for="item in visibleItems()" :key="item.id"><button @click="mode==='projects'?selectProject(item):selectCompany(item)" class="block w-full border-l-4 border-transparent p-4 text-left hover:bg-slate-50" :class="((mode==='projects'&&selectedProject?.id===item.id)||(mode==='companies'&&selectedCompany?.id===item.id))?'bg-blue-50 border-blue-600':''"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><h3 class="truncate font-semibold" x-text="mode==='projects'?item.name:item.name.trim()"></h3><p class="mt-1 truncate text-xs text-slate-500" x-text="mode==='projects'?companyName(item.companyId):item.location"></p></div><span class="shrink-0 rounded-full px-2 py-1 text-[10px]" :class="mode==='projects'?statusClass(item.status):'bg-blue-50 text-blue-700'" x-text="mode==='projects'?formatStatus(item.status):companyProjectCount(item.id)+' projects'"></span></div><p x-show="mode==='companies'" class="mt-2 truncate text-xs text-slate-400" x-text="item.industry"></p></button></template><div x-show="visibleItems().length===0" class="p-8 text-center text-sm text-slate-500">No matching records.</div></div></aside><section class="min-w-0 rounded-2xl bg-white shadow"><template x-if="mode==='projects'&&selectedProject"><article class="p-5 sm:p-7 lg:p-9"><div class="flex flex-col gap-4 border-b pb-6 sm:flex-row sm:justify-between"><div><p class="text-xs font-semibold uppercase tracking-wider text-blue-600" x-text="companyName(selectedProject.companyId)"></p><h2 class="mt-1 text-2xl font-bold" x-text="selectedProject.name"></h2><div class="mt-3"><span class="rounded-full px-2.5 py-1 text-xs font-semibold" :class="statusClass(selectedProject.status)" x-text="formatStatus(selectedProject.status)"></span></div></div><button @click="copyMarkdown(projectMarkdown(selectedProject))" class="rounded-lg border px-3 py-2 text-xs">Copy Markdown</button></div><div class="mt-6 grid gap-3 sm:grid-cols-3"><div class="rounded-xl bg-slate-50 p-4"><p class="text-xs text-slate-400">Company</p><p class="mt-1 font-medium" x-text="companyName(selectedProject.companyId)"></p></div><div class="rounded-xl bg-slate-50 p-4"><p class="text-xs text-slate-400">Timeline</p><p class="mt-1 font-medium" x-text="(selectedProject.startDate||'—')+' → '+(selectedProject.endDate||'Present')"></p></div><div class="rounded-xl bg-slate-50 p-4"><p class="text-xs text-slate-400">Details</p><p class="mt-1 font-medium" x-text="projectDetailCount(selectedProject.id)"></p></div></div><div class="mt-8"><div class="mb-3 flex justify-between"><h3 class="font-semibold">Project Description</h3><span class="text-xs text-slate-400">Markdown</span></div><div class="markdown text-sm text-slate-700" x-html="renderMarkdown(selectedProject.description||'No project description available.')"></div></div><div class="mt-10 border-t pt-7"><h3 class="text-lg font-bold">Project Details</h3><div class="mt-4 space-y-4"><template x-for="detail in projectDetailsFor(selectedProject.id)" :key="detail.id"><div class="rounded-xl border p-5"><div class="grid gap-5 sm:grid-cols-2"><div><p class="text-xs text-slate-400">Technology</p><p class="mt-1 font-medium" x-text="detail.technology"></p></div><div><p class="text-xs text-slate-400">Team Size</p><p class="mt-1 font-medium" x-text="detail.teamSize"></p></div><div><p class="text-xs text-slate-400">Budget</p><p class="mt-1 font-medium" x-text="formatCurrency(detail.budget)"></p></div><div><p class="text-xs text-slate-400">Client</p><p class="mt-1 font-medium" x-text="detail.clientName"></p></div></div><div class="mt-5 border-t pt-4"><p class="mb-2 text-xs font-semibold uppercase text-slate-400">Notes</p><div class="markdown text-sm text-slate-600" x-html="renderMarkdown(detail.notes||'No notes available.')"></div></div></div></template></div></div></article></template><template x-if="mode==='companies'&&selectedCompany"><article class="p-5 sm:p-7 lg:p-9"><div class="flex justify-between border-b pb-6"><div><p class="text-xs font-semibold uppercase text-blue-600">Company</p><h2 class="mt-1 text-2xl font-bold" x-text="selectedCompany.name.trim()"></h2><p class="mt-2 text-sm text-slate-500" x-text="selectedCompany.industry+' · '+selectedCompany.location"></p></div><button @click="copyMarkdown(companyMarkdown(selectedCompany))" class="rounded-lg border px-3 py-2 text-xs">Copy Markdown</button></div><div class="mt-6 grid gap-3 sm:grid-cols-3"><div class="rounded-xl bg-slate-50 p-4"><p class="text-xs text-slate-400">Industry</p><p class="mt-1 font-medium" x-text="selectedCompany.industry"></p></div><div class="rounded-xl bg-slate-50 p-4"><p class="text-xs text-slate-400">Location</p><p class="mt-1 font-medium" x-text="selectedCompany.location"></p></div><div class="rounded-xl bg-slate-50 p-4"><p class="text-xs text-slate-400">Projects</p><p class="mt-1 font-medium" x-text="companyProjectCount(selectedCompany.id)"></p></div></div><div class="mt-8"><h3 class="text-lg font-bold">Projects</h3><div class="mt-4 space-y-3"><template x-for="project in companyProjects(selectedCompany.id)" :key="project.id"><button @click="mode='projects';selectProject(project)" class="block w-full rounded-xl border p-4 text-left hover:border-blue-300 hover:bg-blue-50"><div class="flex justify-between"><span class="font-medium" x-text="project.name"></span><span class="rounded-full px-2 py-1 text-xs" :class="statusClass(project.status)" x-text="formatStatus(project.status)"></span></div><p class="mt-2 text-xs text-slate-500" x-text="project.description||'No description available.'"></p></button></template></div></div><div class="mt-8 border-t pt-7"><h3 class="font-semibold">Company Markdown</h3><div class="markdown mt-3 text-sm text-slate-700" x-html="renderMarkdown(companyMarkdown(selectedCompany))"></div></div></article></template><template x-if="!selectedProject&&!selectedCompany"><div class="flex min-h-[680px] items-center justify-center p-8 text-center"><div><div class="text-4xl">📁</div><h2 class="mt-4 font-semibold">Select a record</h2><p class="mt-1 text-sm text-slate-500">Choose a company or project from the list.</p></div></div></template></section></div></div></template></main><div x-show="toast" x-cloak class="fixed bottom-5 right-5 rounded-lg bg-slate-900 px-4 py-3 text-sm text-white" x-text="toast"></div><script src="./assets/app.js"></script></body></html>
